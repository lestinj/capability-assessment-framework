# Capability Assessment Framework Configuration

# Environment: development, staging, production
environment: development

# LLM Configuration
llm:
  # Provider: ollama (dev), vllm (prod)
  provider: ollama
  model: llama3.1:70b
  base_url: http://localhost:11434
  temperature: 0.1
  max_tokens: 4096
  # vLLM settings (production)
  vllm:
    base_url: http://localhost:8000
    tensor_parallel_size: 4

# Embedding Configuration
embeddings:
  model: BAAI/bge-large-en-v1.5
  dimension: 1024
  batch_size: 32
  device: cuda  # cuda, cpu, mps

# Reranker Configuration
reranker:
  model: BAAI/bge-reranker-v2-m3
  top_k: 10
  device: cuda

# Vector Store Configuration
vector_store:
  provider: qdrant
  host: localhost
  port: 6333
  collection_prefix: caf_
  # Qdrant Cloud settings (optional)
  cloud:
    url: null
    api_key: null

# RAG Configuration
rag:
  chunk_size: 512
  chunk_overlap: 50
  retrieval_top_k: 10
  rerank_top_k: 5
  min_relevance_score: 0.7

# Agent Configuration
agents:
  intake:
    enabled: true
    supported_formats:
      - pdf
      - docx
      - xlsx
      - pptx
      - txt
      - md
  discovery:
    enabled: true
    frameworks:
      - togaf
      - cmmi
      - cobit
  assessment:
    enabled: true
    maturity_scale: 5  # 1-5 CMM scale
    default_framework: cmmi
  reporting:
    enabled: true
    formats:
      - markdown
      - docx
      - pdf

# Orchestration Configuration
orchestration:
  # LangGraph settings
  langgraph:
    checkpoint_dir: ./checkpoints
    max_iterations: 100
  # CrewAI settings
  crewai:
    verbose: true
    max_rpm: 10  # Rate limit for LLM calls

# MCP Tool Configuration
mcp:
  enabled: false
  tools:
    servicenow:
      enabled: false
      instance_url: null
      username: null
      # password: set via environment variable MCP_SERVICENOW_PASSWORD
    cmdb:
      enabled: false
      type: servicenow  # servicenow, custom
    ardoq:
      enabled: false
      api_url: null
      # api_key: set via environment variable MCP_ARDOQ_API_KEY

# API Configuration
api:
  host: 0.0.0.0
  port: 8000
  cors_origins:
    - http://localhost:3000
  rate_limit: 100  # requests per minute

# Logging Configuration
logging:
  level: INFO  # DEBUG, INFO, WARNING, ERROR
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: logs/caf.log
  max_size_mb: 100
  backup_count: 5

# Storage Configuration
storage:
  documents_dir: ./data/documents
  outputs_dir: ./data/outputs
  temp_dir: ./data/temp

# Security Configuration
security:
  # API authentication
  api_key_enabled: false
  # api_key: set via environment variable CAF_API_KEY
  
  # Data handling
  retain_documents_days: 30
  encrypt_at_rest: false
  
  # Audit logging
  audit_enabled: true
  audit_log: logs/audit.log
